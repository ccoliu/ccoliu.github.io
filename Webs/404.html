<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Maintenance</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(135deg, rgba(34, 34, 34, 0.8), rgba(0, 0, 0, 0.8)), url('../icons/serverMaintain.png');
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            color: #cccccc;
            text-align: center;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.29); /* Semi-transparent background */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2.5px);
            animation: fadeIn 1.5s ease-in-out;
            max-width: 80%;
            margin: 0 20px;
        }

        h1 {
            font-size: 5.5vw;
            margin: 0 0 15px 0;
            background: linear-gradient(45deg, #3399ff, #66ccff); /* Brighter blue gradient */
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #66ccff, 0 0 30px #66ccff, 0 0 45px #3399ff; /* More intense bright blue glow */
            animation: textGlow 1.2s infinite alternate; /* Faster and more noticeable glow animation */
            font-weight: 500;
        }
        

        p {
            font-size: 1.8vw;
            margin: 0 0 30px 0;
            color: #d1d1d1; /* Warm grey for contrast */
        }

        a {
            font-size: 1.8vw;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #1e3c72;
            padding: 10px 30px;
            border-radius: 50px;
            background-color: transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(30, 60, 114, 0.3); /* Shadow with blue tone */
            display: inline-block;
            margin-top: 15px;
        }

        a:hover {
            background-color: #1e3c72;
            color: #ffffff;
            box-shadow: 0 6px 12px rgba(30, 60, 114, 0.6);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 7vw;
            }

            p {
                font-size: 4vw;
            }

            a {
                font-size: 4vw;
                padding: 15px 30px;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 20px #66ccff, 0 0 40px #66ccff, 0 0 60px #3399ff;
            }
            100% {
                text-shadow: 0 0 30px #66ccff, 0 0 50px #3399ff, 0 0 70px #3399ff;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Server Maintenance</h1>
        <p>Please contact the developer or wait for the server to come online.</p>
        <a href="/">Go back to Home Page</a>
    </div>
</body>
</html>
