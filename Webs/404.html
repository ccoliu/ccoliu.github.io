<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('../icons/serverMaintain.png'); /* Replace with your background image */
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            text-align: center;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7); /* Dark overlay for readability */
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            font-size: 4vw;
            margin: 0 0 20px 0;
        }

        p {
            font-size: 2vw;
            margin: 0 0 20px 0;
        }

        a {
            font-size: 2vw;
            color: #ffcc00;
            text-decoration: none;
            border: 2px solid #ffcc00;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #ffcc00;
            color: #000000;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 8vw;
            }

            p {
                font-size: 4vw;
            }

            a {
                font-size: 4vw;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Server Maintenance</h1>
        <p>伺服器維護中</p>
        <p>Please contact the developer or wait for the server to come online.</p>
        <p>請聯絡開發者或等候伺服器上架。</p>
        <a href="/">Go back to Home Page</a>
    </div>
</body>
</html>
