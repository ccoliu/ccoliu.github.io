<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>progress-bar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }

        #progress-container {
            width: 80%;
            background: linear-gradient(90deg, #0a0a0a, #1f1f1f);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        #progress-bar {
            width: 0;
            height: 30px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 12px;
            box-shadow: 0 0 15px #0072ff, 0 0 20px #00c6ff, inset 0 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: width 1s ease; /* 使用 transition 实现平滑过渡 */
        }

        #progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            0% {
                opacity: 0;
                transform: translateX(-100%);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        #glow-effect {
            position: absolute;
            top: -10px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            background: rgba(0, 114, 255, 0.3);
            filter: blur(20px);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="progress-container">
        <div id="glow-effect"></div>
        <div id="progress-bar"></div>
    </div>

    <script>
        let currentProgress = 0;
        let targetProgress = 0;

        function updateProgress(newPercentage) {
            targetProgress = newPercentage;
            const progressBar = document.getElementById('progress-bar');
            
            // 添加一个临时的动画结束监听器，确保光影动画结束后才推进进度条
            progressBar.addEventListener('animationiteration', function() {
                if (currentProgress < targetProgress) {
                    progressBar.style.width = targetProgress + '%';
                    currentProgress = targetProgress;
                }
            }, { once: true });
        }

        // 測試函式，模擬進度條的運行
        function testProgressBar() {
            const testSteps = [10, 15, 33, 60, 80, 50, 100];
            let stepIndex = 0;

            const progressInterval = setInterval(() => {
                if (stepIndex < testSteps.length) {
                    updateProgress(testSteps[stepIndex]);
                    stepIndex++;
                } else {
                    clearInterval(progressInterval);

                    // 測試完成後重置進度條
                    setTimeout(() => {
                        const progressBar = document.getElementById('progress-bar');
                        progressBar.style.width = '0%';
                    }, 1000); // 一秒後重置
                }
            }, 3000); // 每三秒更新一次
        }

        // 在頁面載入完成後自動測試進度條
        document.addEventListener('DOMContentLoaded', () => {
            testProgressBar();
        });
    </script>
</body>
</html>
